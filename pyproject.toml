[project]
name = "icelab-eval-tool"
version = "0.1.0"
description = "Tribology CoF evaluation tool (marimo app)"
requires-python = ">=3.11"
dependencies = [
    "marimo (>=0.23.14,<0.25.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.marimo.runtime]
# Default (8MB) leaves little headroom above the raw-sample results table on
# a real, long test file (~6.5MB for a ~200,000-row file). Room for bigger
# files without hitting marimo's "output too large" warning.
output_max_bytes = 20_000_000

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
