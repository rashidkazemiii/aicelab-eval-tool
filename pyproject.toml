[project]
name = "icelab-eval-tool"
version = "0.1.0"
description = "Tribology CoF evaluation tool (marimo app)"
requires-python = ">=3.11"
dependencies = [
    "marimo (>=0.23.14,<0.25.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
